# Declarative Automation Bundle for the ED to inpatient handoff reference app.
# The workspace comes from your CLI profile (for example DATABRICKS_CONFIG_PROFILE=edip), so no host is stored here.
#   databricks bundle deploy -t dev
#   databricks bundle run edip_pipeline -t dev
bundle:
  name: edip-handoff-app

variables:
  catalog:
    description: Unity Catalog catalog that holds bronze, silver and gold
    default: edip

targets:
  dev:
    mode: development
    default: true

resources:
  pipelines:
    edip_pipeline:
      name: edip-pipeline
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false   # switched on through the API only for demos and freshness tests
      channel: CURRENT
      configuration:
        edip.catalog: ${var.catalog}
        edip.code_path: ${workspace.file_path}/pipelines
      libraries:
        - file:
            path: ./pipelines/edip_pipeline.py

  jobs:
    handoff_generator:
      name: edip-handoff-generator
      tags: {project: edip}
      max_concurrent_runs: 1
      parameters:
        - {name: limit, default: "0"}
        - {name: model, default: ""}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: ["pyyaml>=6", "databricks-sdk>=0.50"]
      tasks:
        - task_key: generate
          environment_key: default
          spark_python_task:
            python_file: ./jobs/handoff_job.py
            parameters: [--catalog, "${var.catalog}", --code-path, "${workspace.file_path}", --limit, "{{job.parameters.limit}}",
                         --model, "{{job.parameters.model}}"]

    nightly_shutdown:
      name: edip-nightly-shutdown
      tags: {project: edip}
      schedule: {quartz_cron_expression: "0 0 1 * * ?", timezone_id: America/Los_Angeles, pause_status: UNPAUSED}
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: ["databricks-sdk>=0.50"]
      tasks:
        - task_key: demo_down
          environment_key: default
          spark_python_task:
            python_file: ./scripts/demo_ctl.py
            parameters: [down]
