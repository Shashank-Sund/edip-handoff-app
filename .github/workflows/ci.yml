name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for secrets and identifiers (generic patterns only)
        run: python3 -I scripts/scan_sensitive.py .
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (local only, no Databricks credentials)
        run: pytest -q
