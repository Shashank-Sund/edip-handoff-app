name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the live store tests (tests/test_live_postgres.py creates and drops its own
    # databases in it). The password only ever exists in this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: edip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EDIP_TEST_PG: postgresql://postgres:edip@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for secrets and identifiers (generic patterns only)
        run: python3 -I scripts/scan_sensitive.py .
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests and live store tests (the Postgres service above; no Databricks credentials)
        # -rs lists every skipped test with its reason: tests/test_live_postgres.py must not be among them.
        run: pytest -q -rs
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build --outDir dist
  static-demo-parity:
    # The static demo's in-browser API must answer exactly as the FastAPI app does (app/fixtures/parity.py
    # drives the server on fixtures built from the stand in world; no network, no Databricks credentials).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - name: Install
        run: pip install -e ".[dev]" && (cd app/client && npm ci)
      - name: Expected answers from the server
        run: python app/fixtures/parity.py
      - name: Parity test
        working-directory: app/client
        env:
          EDIP_PARITY_REQUIRED: "1"
        run: npx vitest run src/demo
      - name: Static demo build has no server calls
        working-directory: app/client
        run: npm run build:demo
