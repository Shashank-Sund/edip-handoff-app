[project]
name = "edip-handoff-app"
version = "0.1.0"
description = "ED to inpatient handoff reference app on Databricks (synthetic data)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27", "uvicorn[standard]>=0.30"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
